name: sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency: sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SRC_OWNER: ${{ secrets.SRC_OWNER }}
      SRC_NAME: ${{ secrets.SRC_NAME }}
      NEW_NAME: qorvex
      DST_SLUG: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_TOKEN }}
      - name: Rebuild snapshot
        run: |
          git fetch -q --depth 1 "https://github.com/$SRC_OWNER/$SRC_NAME.git" main
          git read-tree --reset -u FETCH_HEAD
          git checkout HEAD -- .obscure .github/workflows/sync.yml
          node .obscure/transform.mjs
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm sync
          git push
